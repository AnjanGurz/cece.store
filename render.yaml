services:
  - type: web
    name: cece-store-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a random secret
      - key: ADMIN_PASSWORD
        sync: false                  # Set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false                  # Set to your Netlify URL, e.g. https://cece-store.netlify.app
